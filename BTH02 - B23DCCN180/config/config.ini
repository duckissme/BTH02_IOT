[MQTT]
; Wokwi KHÔNG truy cập được localhost -> dùng broker công cộng (hoặc HiveMQ Cloud / EMQX Cloud).
; Khi test bằng simulator + Mosquitto local: đặt host = localhost
host = broker.emqx.io
port = 1883
; Chọn topic có MSSV để không trùng với sinh viên khác trên broker công cộng.
topic = iot/b23dccn180/+/telemetry
username =
password =
client_id = collector-b23dccn180
qos = 1

[INFLUX]
url = http://localhost:8086
org = ptit-iot
bucket_raw = iot_raw
bucket_clean = iot_clean
; token đặt qua biến môi trường IOT_INFLUX_TOKEN (không ghi vào file này)
token =

[PIPELINE]
location = lab-A1
dedupe_cache = 20000
spool_file = data/spool.lp
stats_interval_s = 30

[VALIDATION]
temperature_min = -40
temperature_max = 80
humidity_min = 0
humidity_max = 100
distance_cm_min = 2
distance_cm_max = 400
rssi_min = -120
rssi_max = 0

[PREPROCESS]
resample = 30s
; iqr | zscore | hampel (hampel tốt hơn khi tín hiệu có xu hướng/chu kỳ)
outlier_method = iqr
iqr_k = 1.5
z_threshold = 3.0
interp_limit = 4
rolling_window = 5
